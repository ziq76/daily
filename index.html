<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Daily Alignment | 4x Protocol</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-black text-zinc-100 min-h-screen flex flex-col items-center p-4 selection:bg-zinc-800">

  <main class="w-full max-w-md my-4 space-y-5">
    
    <!-- Header -->
    <header class="border-b border-zinc-900 pb-3 flex justify-between items-baseline">
      <div>
        <h1 class="text-[10px] font-bold uppercase tracking-[0.25em] text-zinc-500 mono">ALIGNMENT PROTOCOL</h1>
        <div class="text-xl font-extrabold tracking-tight text-white uppercase">DAILY CHECK-IN (4X)</div>
      </div>
      <div id="todayDate" class="mono text-xs text-zinc-500">Memuatkan...</div>
    </header>

    <!-- Scoreboard: Pengiraan Hari & Sesi -->
    <div class="grid grid-cols-2 gap-3">
      <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4">
        <span class="text-[10px] mono uppercase text-zinc-500 block">Streak Hari Berturut</span>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="streakCount" class="text-4xl font-extrabold text-emerald-400 mono">0</span>
          <span class="text-xs text-zinc-500">HARI</span>
        </div>
      </div>
      <div class="bg-zinc-950 border border-zinc-900 rounded-2xl p-4">
        <span class="text-[10px] mono uppercase text-zinc-500 block">Total Check-In Sesi</span>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="totalCheckins" class="text-4xl font-extrabold text-zinc-100 mono">0</span>
          <span class="text-xs text-zinc-500">SESI</span>
        </div>
      </div>
    </div>

    <!-- Panel Input Refleksi -->
    <section class="bg-zinc-950 border border-zinc-900 rounded-2xl p-5 space-y-5">
      
      <!-- Pilihan 4 Slot Waktu -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <span class="text-[10px] mono uppercase text-zinc-400 font-bold tracking-wider">PILIH SESI SEMASA:</span>
          <span id="statusBadge" class="text-[10px] mono font-bold px-2 py-0.5 rounded bg-zinc-900 text-zinc-500 border border-zinc-800">BELUM SAH</span>
        </div>
        <div class="grid grid-cols-2 gap-2 mono text-xs">
          <button type="button" onclick="selectSlot('Pagi (6 AM)', this)" class="slot-btn p-2.5 rounded-xl border border-emerald-500 bg-zinc-900 text-emerald-400 font-bold text-center">
            Pagi (6 AM)
          </button>
          <button type="button" onclick="selectSlot('Tengah Hari (12 PM)', this)" class="slot-btn p-2.5 rounded-xl border border-zinc-800 bg-black text-zinc-400 font-bold text-center">
            Tgh Hari (12 PM)
          </button>
          <button type="button" onclick="selectSlot('Petang (4 PM)', this)" class="slot-btn p-2.5 rounded-xl border border-zinc-800 bg-black text-zinc-400 font-bold text-center">
            Petang (4 PM)
          </button>
          <button type="button" onclick="selectSlot('Malam (9 PM)', this)" class="slot-btn p-2.5 rounded-xl border border-zinc-800 bg-black text-zinc-400 font-bold text-center">
            Malam (9 PM)
          </button>
        </div>
      </div>

      <!-- BAHAGIAN PALING ATAS: TICK PENEGASAN KAWALAN DIRI (TIADA PERKATAAN TIDAK) -->
      <div class="space-y-2.5 pb-2 border-b border-zinc-900">
        <span class="text-[10px] mono uppercase text-emerald-500 font-bold tracking-wider block">PENEGASAN KAWALAN DIRI:</span>
        
        <!-- Ikrar 1 -->
        <div onclick="toggleAffirm(1)" class="flex items-center justify-between
